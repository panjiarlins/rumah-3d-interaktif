<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rumah Sumsel – 360° per ruang</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2228; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #ui { position: absolute; top: 12px; left: 12px; width: 230px; max-height: calc(100% - 24px); overflow: auto; box-sizing: border-box;
        background: rgba(255,255,255,.9); backdrop-filter: blur(8px); border-radius: 12px; padding: 12px 14px; font-size: 13px; color: #1f2a30;
        box-shadow: 0 4px 22px rgba(0,0,0,.25); }
  #ui.min { width: auto; } #ui.min .body { display: none; }
  h1 { font-size: 15px; margin: 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: #6a747a; margin: 12px 0 6px; }
  .list { display: grid; gap: 4px; }
  button { font: inherit; font-size: 12px; padding: 6px 8px; border: 1px solid #c9cfd3; background: #fff; border-radius: 7px; cursor: pointer; text-align: left; color: #1f2a30; }
  button:hover { background: #eef4f7; } button.on { background: #2f5f7a; color: #fff; border-color: #2f5f7a; }
  button:focus-visible { outline: 2px solid #2f5f7a; outline-offset: 1px; }
  label { display: flex; gap: 7px; align-items: center; margin-top: 8px; cursor: pointer; }
  a { color: #2f5f7a; }
  #title { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); background: rgba(20,24,28,.72); color: #fff; padding: 6px 14px;
           border-radius: 8px; font-size: 14px; font-weight: 600; pointer-events: none; }
  #help { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(20,24,28,.72); color: #fff;
          padding: 6px 12px; border-radius: 8px; font-size: 12px; pointer-events: none; white-space: nowrap; }
  #err { position: absolute; top: 60px; right: 12px; max-width: 420px; background: #a8322d; color: #fff; padding: 8px 10px; border-radius: 8px; font: 12px monospace; display: none; white-space: pre-wrap; }
</style>
<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head>
<body>
<div id="ui">
  <h1><span>360° per ruang</span><button id="min" aria-label="Sembunyikan panel">–</button></h1>
  <div class="body">
    <h2>Pilih ruang</h2>
    <div class="list" id="list"></div>
    <label><input type="checkbox" id="real" disabled> Versi realistis (ChatGPT)</label>
    <div id="realnote" style="font-size:11px;color:#6a747a;margin:2px 0 0 22px">belum ada untuk ruang ini</div>
    <label><input type="checkbox" id="spin"> Putar otomatis</label>
    <p style="font-size:11px;color:#6a747a;line-height:1.4">Dirender dari model 3D (ukuran sesuai denah). <a href="rumah-3d-interaktif.html">← kembali ke 3D interaktif</a></p>
  </div>
</div>
<div id="title"></div>
<div id="help">Seret untuk melihat sekeliling · gulir / cubit untuk zoom · panah kiri/kanan</div>
<div id="err" role="alert"></div>
<script type="module">
// Equirectangular 2:1 panoramas rendered by rumah-3d-interaktif.html?pano=<key>; list in gambar/360/index.json.
import * as THREE from 'three';

const DIR = 'gambar/360/', REAL = 'gambar/360-realistis/';
let realKeys = {}, current = null;            // keys with a ChatGPT version -> number of photo-real faces
const $ = (id) => document.getElementById(id);
const showErr = (m) => { $('err').style.display = 'block'; $('err').textContent = m; };
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 10);
let yaw = Math.PI / 2, pitch = 0, drag = null, pinch = null;   // yaw π/2 = look toward the image centre
const loader = new THREE.TextureLoader();
const cache = {};

function look() {
  pitch = THREE.MathUtils.clamp(pitch, -1.4, 1.4);
  camera.lookAt(Math.cos(pitch) * Math.cos(yaw - Math.PI / 2), Math.sin(pitch), Math.cos(pitch) * Math.sin(yaw - Math.PI / 2));
}
function show(item) {
  current = item;
  document.querySelectorAll('#list button').forEach((b) => b.classList.toggle('on', b.dataset.k === item.key));
  const nreal = realKeys[item.key];
  $('real').disabled = !nreal;
  $('realnote').textContent = nreal ? (nreal + '/6 sisi dari ChatGPT') : 'belum ada untuk ruang ini';
  const useReal = nreal && $('real').checked, url = (useReal ? REAL : DIR) + item.key + '.jpg';
  $('title').textContent = item.n + (useReal ? ' · realistis' : '');
  history.replaceState(null, '', '#' + item.key);
  const set = (t) => { scene.background = t; };
  if (cache[url]) return set(cache[url]);
  loader.load(url, (t) => {
    t.mapping = THREE.EquirectangularReflectionMapping;
    t.colorSpace = THREE.SRGBColorSpace;
    cache[url] = t; set(t);
  }, undefined, () => showErr('Gagal memuat ' + url));
}
$('real').onchange = () => current && show(current);
fetch(REAL + 'index.json').then((r) => r.ok ? r.json() : []).then((list) => {
  realKeys = Object.fromEntries(list.map((i) => [i.key, i.foto]));
  if (current) show(current);
}).catch(() => {});
fetch(DIR + 'index.json').then((r) => r.json()).then((items) => {
  for (const it of items) {
    const b = document.createElement('button');
    b.textContent = it.n; b.dataset.k = it.key; b.onclick = () => show(it);
    $('list').appendChild(b);
  }
  show(items.find((i) => i.key === location.hash.slice(1)) || items[0]);
}).catch((e) => showErr('Daftar ruang tidak bisa dimuat (' + e + '). Buka lewat GitHub Pages atau server lokal.'));

const el = renderer.domElement;
el.addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const k = camera.fov / innerHeight * Math.PI / 180;
  yaw += (e.clientX - drag[0]) * k; pitch += (e.clientY - drag[1]) * k; drag = [e.clientX, e.clientY];
});
addEventListener('pointerup', () => { drag = null; });
el.addEventListener('wheel', (e) => { camera.fov = THREE.MathUtils.clamp(camera.fov + e.deltaY * 0.05, 35, 100); camera.updateProjectionMatrix(); e.preventDefault(); }, {passive: false});
el.addEventListener('touchmove', (e) => {
  if (e.touches.length !== 2) { pinch = null; return; }
  const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  if (pinch) { camera.fov = THREE.MathUtils.clamp(camera.fov * pinch / d, 35, 100); camera.updateProjectionMatrix(); }
  pinch = d;
}, {passive: true});
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') yaw -= 0.08; if (e.key === 'ArrowRight') yaw += 0.08;
  if (e.key === 'ArrowUp') pitch += 0.06; if (e.key === 'ArrowDown') pitch -= 0.06;
});
$('min').onclick = () => { const u = $('ui'); u.classList.toggle('min'); $('min').textContent = u.classList.contains('min') ? '+' : '–'; };
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => {
  if ($('spin').checked && !drag) yaw += 0.0015;
  look();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
